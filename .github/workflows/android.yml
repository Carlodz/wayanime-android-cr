name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor - add android + sync
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Stamp version (new build)
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          RUN=${{ github.run_number }}
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d_%H%M)
          TAG="v${VER}-run${RUN}-${SHA}"
          echo "WA_TAG=${TAG}" >> $GITHUB_ENV
          echo "WA_VER=${VER}" >> $GITHUB_ENV
          echo "WA_RUN=${RUN}" >> $GITHUB_ENV
          # حقن رقم البناء فـ الواجهة
          echo "window.WA_BUILD={v:'${VER}',run:${RUN},sha:'${SHA}',date:'${DATE}'};" > www/version.js
          if [ -f www/index.html ]; then
            grep -q 'version.js' www/index.html || sed -i 's#<script src="android-api.js"></script>#<script src="version.js"></script>\n<script src="android-api.js"></script>#' www/index.html || true
          fi
          npx cap sync android
          # versionCode / versionName فـ Gradle
          G=android/app/build.gradle
          if [ -f "$G" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${RUN}/" $G || true
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VER}.${RUN}\"/" $G || true
            grep -n "versionCode\|versionName" $G || true
          fi
          echo "Building ${TAG}"

      - name: Native plugins
        run: |
          set -e
          JAVA=android/app/src/main/java/com/wayanime/app
          mkdir -p $JAVA
          for f in native/*.java; do
            [ -f "$f" ] && cp "$f" $JAVA/
          done
          ls -la $JAVA/

      - name: Notifications extras (optional)
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          if ls native/ic_*.xml 1>/dev/null 2>&1; then cp native/ic_*.xml android/app/src/main/res/drawable/; fi
          if [ -f native/EpisodeWorker.java ]; then
            grep -q "androidx.work:work-runtime" android/app/build.gradle || sed -i '/^dependencies {/a\    implementation "androidx.work:work-runtime:2.9.1"' android/app/build.gradle
            grep -q "org.jsoup:jsoup" android/app/build.gradle || sed -i '/^dependencies {/a\    implementation "org.jsoup:jsoup:1.17.2"' android/app/build.gradle
          fi
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M || true

      - name: App icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          RES=android/app/src/main/res
          ICON=""
          for c in assets/app-icon.png www/assets/app-icon.png assets/icon.png www/assets/icon.png; do
            if [ -f "$c" ]; then ICON="$c"; break; fi
          done
          if [ -z "$ICON" ]; then echo "::warning::no icon, skip"; exit 0; fi
          ls -la "$ICON"
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            fw=$((f*66/100))
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            $IM $RES/mipmap-$n/ic_launcher.png \( -size ${s}x${s} xc:black -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -alpha off -compose CopyOpacity -composite $RES/mipmap-$n/ic_launcher_round.png
            $IM "$ICON" -resize ${fw}x${fw} -background none -gravity center -extent ${f}x${f} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml $RES/drawable/ic_launcher_foreground.xml $RES/drawable-v24/ic_launcher_background.xml 2>/dev/null || true
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/values/wa_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="wa_icon_bg">#bf9997</color>
          </resources>
          XML
          for x in ic_launcher ic_launcher_round; do
            cat > $RES/mipmap-anydpi-v26/$x.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/wa_icon_bg"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK (new version)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "WayAnime-${WA_TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "WayAnime-latest.apk"
          ls -lh WayAnime-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WayAnime-${{ env.WA_TAG }}
          path: |
            WayAnime-${{ env.WA_TAG }}.apk
            WayAnime-latest.apk
          retention-days: 30
