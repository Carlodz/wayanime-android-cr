name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor - add android + sync
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Stamp version 3.0
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          RUN=${{ github.run_number }}
          VCODE=$((30000 + RUN))
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d_%H%M)
          TAG="v${VER}-b${RUN}-${SHA}"
          echo "WA_TAG=${TAG}" >> $GITHUB_ENV
          echo "WA_VCODE=${VCODE}" >> $GITHUB_ENV
          echo "window.WA_BUILD={v:'${VER}',run:${RUN},code:${VCODE},sha:'${SHA}',date:'${DATE}'};" > www/version.js
          if [ -f www/index.html ] && ! grep -q 'version.js' www/index.html; then
            sed -i 's#android-api.js#version.js"></script>\n<script src="android-api.js#' www/index.html || true
          fi
          npx cap sync android
          G=android/app/build.gradle
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VCODE}/" $G
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${VER}\"/" $G
          if ! grep -q "versionCode ${VCODE}" $G; then
            sed -i "/defaultConfig {/a\        versionCode ${VCODE}\n        versionName \"${VER}\"" $G
          fi
          grep -n "versionCode\|versionName" $G || true
          echo "Building ${TAG}"

      - name: Native WayNative plugin
        run: |
          set -e
          JAVA=android/app/src/main/java/com/wayanime/app
          mkdir -p $JAVA
          cp native/MainActivity.java native/WayNativePlugin.java $JAVA/
          ls -la $JAVA/
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M || true

      - name: App icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          RES=android/app/src/main/res
          ICON=""
          for c in www/assets/icon.png assets/app-icon.png assets/icon.png; do
            [ -f "$c" ] && ICON="$c" && break
          done
          [ -z "$ICON" ] && echo "::warning::no icon" && exit 0
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            fw=$((f*66/100))
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            $IM $RES/mipmap-$n/ic_launcher.png \( -size ${s}x${s} xc:black -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -alpha off -compose CopyOpacity -composite $RES/mipmap-$n/ic_launcher_round.png
            $IM "$ICON" -resize ${fw}x${fw} -background none -gravity center -extent ${f}x${f} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          rm -f $RES/drawable-v24/ic_launcher_*.xml $RES/drawable/ic_launcher_*.xml 2>/dev/null || true
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="wa_icon_bg">#07060c</color></resources>' > $RES/values/wa_icon_colors.xml
          for x in ic_launcher ic_launcher_round; do
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/wa_icon_bg"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' > $RES/mipmap-anydpi-v26/$x.xml
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "WayAnime-${WA_TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "WayAnime-v3-latest.apk"
          ls -lh WayAnime-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WayAnime-${{ env.WA_TAG }}
          path: |
            WayAnime-${{ env.WA_TAG }}.apk
            WayAnime-v3-latest.apk
          retention-days: 30
